<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Участник команды «ВАПА»</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="section" id="main">
        <div class="container">
            <a class="btn btn--ghost" href="osn.html#team">← Назад к команде</a>

            <article class="card member" id="memberCard" style="margin-top:24px; max-width:560px;">
                <div class="member__avatar" id="mAvatar" aria-hidden="true"></div>
                <h1 class="member__name" id="mName"></h1>
                <p class="member__role" id="mRole"></p>
                <p class="member__group" id="mGroup"></p>
                <p class="member__info" id="mInfo"></p>
                <ul class="chips" id="mSkills" aria-label="Навыки участника"></ul>
                <a class="member__contact" id="mMail" href="#">Написать</a>
            </article>

            <p style="margin-top:24px;">
                <a class="btn btn--primary" href="index.html#team">← Вернуться назад</a>
            </p>
        </div>
    </main>

    <script>
        const members = {
            "1": {
                avatar: "У1",
                name: "Губеева Альбина",
                info:"Здравствуйте!Меня зовут Альбина.Добро пожаловать на мою страницу.Здесь вы найдете информацию обо мне и моем опыте.Если вам близко то,чем я занимаюсь,—буду рада общению и сотрудничеству.",
                role: "Капитан · Backend-разработчик",
                group: "Группа 861-ТОП243",
                skills: [ "TypeScript", "Git" , "Python", "C++"],
                mail: "gubaalbin@yandex.ru"
            },
            "2": {
                avatar: "у2",
                name: "Валерия",
                info:"",
                role: "UI/UX-дизайнер",
                group: "Группа 861-ТОП243",
                skills: ["Python", "HTML", "CSS", "Адаптивность"],
                mail: "design@example.ru"
            },
            "3": {
                avatar: "У3",
                name: "Полина",
                info:"",
                role: "Видеомейкер",
                group: "Группа 861-ТОП243",
                skills: ["Python", "C++"],
                mail: "po12linka@gmail.com"
            },
            "4": {
                avatar: "У4",
                name: "Адель",
                info:"",
                role: "Аналитик · Тестирование",
                group: "Группа 861-ТОП243",
                skills: ["SQL", "Postman", "Pytest", "Документация"],
                mail: "shaihatova.adel@yandex.ru"
            }
        };

        // Берём id из адреса: member.html?id=2
        const id = new URLSearchParams(location.search).get('id');
        const m = members[id];

        if (!m) {
            document.getElementById('memberCard').innerHTML =
                '<p>Участник не найден. <a href="index.html#team">Вернуться к команде</a></p>';
        } else {
            document.title = m.name + ' — команда «ВАПА»';
            document.getElementById('mAvatar').textContent = m.avatar;
            document.getElementById('mName').textContent = m.name;
            document.getElementById('mRole').textContent = m.role;
            document.getElementById('mGroup').textContent = m.group;
            document.getElementById('mInfo').textContent = m.info || '';

            const skills = document.getElementById('mSkills');
            m.skills.forEach(s => {
                const li = document.createElement('li');
                li.textContent = s;
                skills.appendChild(li);
            });

            const mail = document.getElementById('mMail');
            mail.href = 'mailto:' + m.mail;
            mail.textContent = 'Написать: ' + m.mail;
        }
    </script>
</body>


</html>
